name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version v$version"
          }

      - name: Verify tracked RoseData payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'RoseData/list_items.json',
            'RoseData/list_npc.json',
            'RoseData/quests/quests.json',
            'RoseData/crafts/all_recipes.json',
            'RoseData/drops.json',
            'RoseData/zones.json'
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required tracked data file is missing: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Required tracked data file is empty: $file"
            }
          }

          $jsonFiles = @(Get-ChildItem -LiteralPath 'RoseData' -Recurse -File -Filter '*.json')
          if ($jsonFiles.Count -eq 0) {
            throw 'RoseData contains no JSON files'
          }
          foreach ($file in $jsonFiles) {
            if ($file.Length -eq 0) {
              throw "RoseData JSON file is empty: $($file.FullName)"
            }
            try {
              $parsed = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            } catch {
              throw "RoseData JSON file is invalid: $($file.FullName): $($_.Exception.Message)"
            }
            if ($null -eq $parsed) {
              throw "RoseData JSON file contains no data: $($file.FullName)"
            }
            if ($parsed -is [array] -and $parsed.Count -eq 0) {
              throw "RoseData JSON array is empty: $($file.FullName)"
            }
            if ($parsed -is [pscustomobject] -and $parsed.PSObject.Properties.Count -eq 0) {
              throw "RoseData JSON object is empty: $($file.FullName)"
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Run release self-checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node overlay/data.js
          node overlay/mods.js
          node overlay/kings.test.js
          node overlay/gems-calc.test.js
          node src/feeds.js
          node src/accountstore.js
          node src/progressstore.test.js
          node src/updater.js
          node src/appupdater.js
          node site/site.test.js

      - name: Verify market response normalization
        run: node src/marketdata.js

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node node_modules/electron-builder/cli.js --win nsis --x64 --config electron-builder.js --publish never

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $required = @(
            'dist/RoseLite-Setup.exe',
            'dist/RoseLite-Setup.exe.blockmap',
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release artifact is missing: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Release artifact is empty: $file"
            }
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(
            'dist/RoseLite-Setup.exe',
            'dist/RoseLite-Setup.exe.blockmap',
            'dist/latest.yml'
          )
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo DrezByte/RoseLite *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo DrezByte/RoseLite
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --latest --generate-notes --title "RoseLite $env:RELEASE_TAG" --repo DrezByte/RoseLite
          }
