name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:TAG_NAME -ne "v$version") {
            throw "Tag $env:TAG_NAME does not match package version v$version"
          }

      - name: Verify tracked RoseData payload
        shell: pwsh
        run: |
          $required = @(
            'RoseData/list_items.json',
            'RoseData/list_npc.json',
            'RoseData/quests/quests.json',
            'RoseData/crafts/all_recipes.json'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required tracked data file is missing: $file"
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Run release self-checks
        run: |
          node overlay/data.js
          node overlay/mods.js
          node overlay/kings.test.js
          node overlay/gems-calc.test.js
          node src/feeds.js
          node src/accountstore.js
          node src/progressstore.test.js
          node src/updater.js
          node src/appupdater.js
          node site/site.test.js

      - name: Build and publish stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROSELITE_RELEASE_TYPE: release
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run release
